<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirror Studio - CVfor1</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=12" />
    <!-- 引入高级字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,700;1,900&family=Great+Vibes&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="hero">
      <div class="hero__primary">
        <div class="brand">MirrorStudio</div>
        <h1>CVfoR1</h1>
      </div>
    </header>

    <!-- 隐藏的配置（仅代码保留，UI完全移除） -->
    <div style="display: none;">
      <input id="apiBase" value="" />
      <input id="sessionId" value="demo-session-001" />
    </div>

    <!-- 对称的双向浮动导航 -->
    <button class="nav-btn left" id="floatingBackBtn" style="display: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    
    <button class="nav-btn right" id="floatingNextBtn" style="display: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

    <main class="carousel-container">
      <div class="carousel-track" id="carouselTrack">
        
        <!-- Step 0: 起始页 -->
        <section class="carousel-card active" data-step="0" id="step-landing">
          <div class="landing-content">
            <div class="main-logo">WhiteMirror | CVfoR1</div>
            <p class="landing-slogan">开启你的职场镜像探索之旅</p>
            <button id="startJourney" class="btn primary premium-btn">
              <span>通往探索之路</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </section>

        <!-- Step 1: 画像分析 -->
        <section class="carousel-card" data-step="1" id="step-profile">
          <div class="card-inner">
            <div class="card-header">
              <span class="badge">STEP 1</span>
              <h2>画像构建</h2>
              <button id="clearProfile" class="btn ghost small">清空</button>
            </div>
            
            <div class="card-body">
              <div class="profile-input-container">
                <div class="input-section">
                  <div class="section-label">自然语言输入</div>
                  <textarea id="freeText" placeholder="在此输入或粘贴你的经历描述，AI 将自动提取关键画像信息..."></textarea>
                </div>

                <div class="input-divider">
                  <span class="line"></span>
                  <span class="text">或者</span>
                  <span class="line"></span>
                </div>

                <div class="input-section">
                  <div class="section-label">简历文件解析</div>
                  <label id="dropzone" class="dropzone-premium">
                    <div class="dropzone-main">
                      <div class="icon-box">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                          <polyline points="14 2 14 8 20 8"></polyline>
                          <line x1="12" y1="18" x2="12" y2="12"></line>
                          <polyline points="9 15 12 12 15 15"></polyline>
                        </svg>
                      </div>
                      <div class="text-box">
                        <strong id="dropzoneText">选择或拖拽简历</strong>
                        <span>支持 PDF, DOCX, HTML</span>
                      </div>
                    </div>
                    <input type="file" id="resumeFile" accept=".pdf,.doc,.docx,.html" />
                  </label>
                </div>

                <div class="button-action-row">
                  <button id="analyzeProfile" class="btn primary large">
                    <span>启动画像分析</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                  </button>
                  <div id="analyzeStatus" class="status-indicator">就绪</div>
                </div>
              </div>
            </div> <!-- 结束 card-body -->

            <!-- 画像结果卡片 (从底部平滑滑入) -->
            <div id="profileResultCard" class="profile-result-card">
              <div class="card-header">
                <h2>个人画像详情</h2>
                <div class="card-actions">
                  <button id="editProfileInCard" class="btn outline small">编辑</button>
                  <button class="btn ghost small" id="closeProfileCard">收起</button>
                </div>
              </div>
              <div class="card-body" id="profileResultContent">
                <!-- 内容动态注入 -->
              </div>
            </div>
          </div>
        </section>

        <!-- Step 2: 岗位推荐 -->
        <section class="carousel-card" data-step="2" id="step-recommend">
          <div class="card-inner">
            <div class="card-header">
              <span class="badge">STEP 2</span>
              <h2>智能岗位推荐</h2>
            </div>
            <div class="card-body">
              <div class="button-row">
                <button id="roleRecommendBtn" class="btn primary">开始推荐</button>
                <span id="roleRecommendStatus"></span>
              </div>
              <div id="roleRecommendations" class="recommendations-area">
                <p class="placeholder">点击“开始推荐”获取智能匹配结果</p>
              </div>
            </div>
          </div>
        </section>

        <!-- Step 3: 岗位搜索 -->
        <section class="carousel-card" data-step="3" id="step-search">
          <div class="card-inner">
            <div class="card-header">
              <span class="badge">STEP 3</span>
              <h2>精准职位检索</h2>
            </div>
            <div class="card-body">
              <div class="search-form">
                <!-- 第一行：核心搜索词 -->
                <div class="form-row main-fields">
                  <div class="input-group">
                    <span class="field-label">职位标题</span>
                    <input id="titles" placeholder="例如：Software Engineer" />
                  </div>
                  <div class="input-group">
                    <span class="field-label">地区</span>
                    <input id="locations" value="AU" />
                  </div>
                </div>

                <!-- 第二行：源控制（对齐的方框） -->
                <div class="form-row settings-fields">
                  <div class="input-group small">
                    <span class="field-label">LinkedIn 数量</span>
                    <input id="linkedinCount" type="number" value="5" min="0" />
                  </div>
                  <div class="input-group small">
                    <span class="field-label">Seek 数量</span>
                    <input id="seekCount" type="number" value="5" min="0" />
                  </div>
                  <div class="input-group small">
                    <span class="field-label">结果总数限制</span>
                    <input id="totalLimit" type="number" value="10" min="1" />
                  </div>
                </div>
              </div>

              <div class="button-row">
                <button id="startStream" class="btn primary">开始检索</button>
                <button id="stopStream" class="btn ghost">停止</button>
                <span id="progress" class="status-indicator">就绪</span>
              </div>
              
              <div id="jobs" class="job-list scrollable">
                <p class="placeholder">实时岗位卡片将在此列出</p>
              </div>
            </div>
          </div>
        </section>

        <!-- Step 4: 简历预览 -->
        <section class="carousel-card" data-step="4" id="step-resume">
          <div class="card-inner">
            <div class="card-header">
              <span class="badge">STEP 4</span>
              <h2>简历匹配生成</h2>
            </div>
            <div class="card-body">
              <div class="resume-header-row">
                <div class="button-row">
                  <button id="editResume" class="btn outline" disabled>编辑</button>
                  <button id="downloadDocx" class="btn outline">DOCX</button>
                  <button id="downloadPdf" class="btn outline">PDF</button>
                </div>
              </div>
              
              <div id="matchResult" class="match-result">
                <div style="grid-column: 1 / -1; text-align: center; color: var(--text-sub);">
                  选择 Step 3 中的职位以进行精准匹配预览
                </div>
              </div>
              
              <iframe id="preview" title="预览" loading="lazy"></iframe>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast"></div>

    <!-- 画像编辑模态框 -->
    <div id="profileEditModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>编辑画像</h3>
          <button id="closeProfileModal" class="btn ghost small">✕</button>
        </div>
        <div class="modal-body">
          <label><span>姓名</span><input id="editName" type="text" /></label>
          <label><span>联系方式</span><input id="editContact" type="text" /></label>
          <label><span>地点</span><input id="editLocation" type="text" /></label>
          <label><span>技能</span><textarea id="editSkills" rows="3"></textarea></label>
          <label><span>教育背景</span><textarea id="editEducation" rows="4"></textarea></label>
          <label><span>工作经历</span><textarea id="editExperience" rows="4"></textarea></label>
          <label><span>个人简介</span><textarea id="editSummary" rows="4"></textarea></label>
        </div>
        <div class="modal-footer">
          <button id="saveProfile" class="btn primary">保存</button>
        </div>
      </div>
    </div>

    <script src="script.js?v=12" defer></script>
  </body>
</html>
